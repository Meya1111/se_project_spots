<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="???" />
    <meta name="author" content="Meya Warrior" />
    <meta name="keywords" content="tutor, test,???" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img alt="Spot logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img alt="Pencil icon" class="profile__pencil-icon" />
            </button>
            <img alt="Bessie Coleman" class="profile__avatar" />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img alt="" />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img alt="" Pencil icon/>New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>

          <template id="card-template">
            <li class="card">
              <button class="card__delete-button" type="button"></button>
              <img src="" alt="" class="card__image" />
              <div class="card__content">
                <h2 class="card__title"></h2>
                <button type="button" class="card__like-btn"></button>
              </div>
            </li>
          </template>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2023 &copy; Spots</p>
      </footer>
    </div>
    <div class="modal" id="edit-profile-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn"></button>
        <h2 class="modal__title">Edit Profile</h2>
        <form
          class="modal__form"
          id="edit-profile-form"
          name="edit-profile-form"
          novalidate
        >
          <label for="edit-profile-input" class="modal__label">
            Name
            <input
              id="edit-profile-input"
              type="text"
              class="modal__input"
              placeholder="Type your name"
              minlength="2"
              maxlength="40"
              required
            />
            <span id="edit-profile-input-error" class="modal__error"></span>
          </label>
          <label for="edit-profile-description" class="modal__label">
            Description
            <input
              id="edit-profile-description"
              type="text"
              class="modal__input"
              placeholder="Describe yourself"
              minlength="2"
              maxlength="200"
              required
            />
            <span
              id="edit-profile-description-error"
              class="modal__error"
            ></span>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>
    <div class="modal" id="new-post-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn"></button>
        <h2 class="modal__title">New post</h2>
        <form class="modal__form">
          <label for="card-link-input" class="modal__label">
            Name
            <input
              id="card-link-input"
              type="url"
              class="modal__input"
              placeholder="Place a link to the picture"
              required
            />
            <span id="card-link-input-error" class="modal__error"></span>
          </label>
          <label for="card-description-input" class="modal__label">
            Description
            <input
              id="card-description-input"
              type="text"
              class="modal__input"
              placeholder="Type your caption"
              minlength="2"
              maxlength="30"
              required
            />
            <span id="card-description-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>
    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__image-container">
        <button
          aria-label="Close modal"
          type="button"
          class="modal__close modal__close_type_preview"
        ></button>
        <div class="modal__image-wrapper">
          <img alt="Close" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>
    </div>
    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn"></button>
        <h3 class="modal__title">Edit avatar</h3>
        <form
          class="modal__form"
          id="edit-avatar-form"
          name="edit-avatar-form"
          novalidate
        >
          <label for="edit-avatar-input" class="modal__label">
            Avatar
            <input
              id="edit-avatar-input"
              class="modal__input"
              placeholder="avatar goes here"
              name="avatar"
              required
            />
            <span id="profile-avatar-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
        <div></div>
      </div>
      <button
        aria-label="Close modal"
        type="button"
        class="modal__close_type_preview"
      ></button>
      <div class="modal__image-wrapper">
        <img alt="Close" class="modal__image" />
        <p class="modal__caption"></p>
      </div>
    </div>
    <div class="modal" id="delete-modal">
      <div class="modal__container modal__container_type_delete">
        <button
          aria-label="Close modal"
          class="modal__close modal__close_type_preview"
          type="button"
        ></button>
        <h3 class="modal__title">
          Are you sure you want to delete this image?
        </h3>
        <form id="delete-form" class="modal__delete-form" novalidate>
          <button
            class="modal__submit-btn modal__submit-btn__type_delete"
            type="submit"
          >
            Delete
          </button>
          <button
            class="modal__submit-btn modal__submit-btn__type_cancel"
            type="button"
          >
            Cancel
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
